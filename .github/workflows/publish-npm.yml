name: Publish Package And Create Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm dist-tag to publish with
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
          - beta
          - alpha
      skip_publish:
        description: Validate and create/update the GitHub Release without publishing to npm
        required: true
        default: false
        type: boolean

permissions:
  id-token: write
  contents: write

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Validate repository
        run: npm run check

      - name: Read package metadata
        id: package
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          echo "name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"

          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether package version is already published
        id: package-version
        run: |
          PUBLISHED_VERSIONS=$(npm view "${{ steps.package.outputs.name }}" versions --json 2>/dev/null || echo "[]")
          if node -e '
            const versions = JSON.parse(process.argv[1]);
            const normalized = Array.isArray(versions) ? versions : [versions];
            process.exit(normalized.includes(process.argv[2]) ? 0 : 1);
          ' "$PUBLISHED_VERSIONS" "${{ steps.package.outputs.version }}"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }} is already published."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }} is not published yet."
          fi

      - name: Publish package
        if: steps.package-version.outputs.published == 'false' && inputs.skip_publish != true
        env:
          NPM_DIST_TAG: ${{ inputs.npm_tag || 'latest' }}
        run: |
          PACKAGE_VERSION="${{ steps.package.outputs.version }}"
          echo "Publishing ${PACKAGE_VERSION} with dist-tag ${NPM_DIST_TAG}."
          npm publish --tag "${NPM_DIST_TAG}"
