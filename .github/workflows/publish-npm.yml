name: Publish Package And Create Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm dist-tag to publish with
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
          - beta
          - alpha
      skip_publish:
        description: Validate and create/update the GitHub Release without publishing to npm
        required: true
        default: false
        type: boolean

permissions:
  id-token: write
  contents: write

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Validate repository
        run: npm run check

      - name: Read package metadata
        id: package
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          echo "name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"

          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether package version is already published
        id: package-version
        run: |
          PUBLISHED_VERSIONS=$(npm view "${{ steps.package.outputs.name }}" versions --json 2>/dev/null || echo "[]")
          if node -e '
            const versions = JSON.parse(process.argv[1]);
            const normalized = Array.isArray(versions) ? versions : [versions];
            process.exit(normalized.includes(process.argv[2]) ? 0 : 1);
          ' "$PUBLISHED_VERSIONS" "${{ steps.package.outputs.version }}"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }} is already published."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }} is not published yet."
          fi

      - name: Publish package
        if: steps.package-version.outputs.published == 'false' && inputs.skip_publish != true
        env:
          NPM_DIST_TAG: ${{ inputs.npm_tag || 'latest' }}
        run: |
          PACKAGE_VERSION="${{ steps.package.outputs.version }}"
          echo "Publishing ${PACKAGE_VERSION} with dist-tag ${NPM_DIST_TAG}."
          npm publish --tag "${NPM_DIST_TAG}"

      - name: Extract release notes from CHANGELOG.md
        id: release-notes
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';

          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const version = process.env.PACKAGE_VERSION;
          const headings = [`## ${version}`, `## v${version}`];

          let releaseBody = '';
          for (const heading of headings) {
            const start = changelog.indexOf(`${heading}\n`);
            if (start === -1) {
              continue;
            }

            const contentStart = start + heading.length + 1;
            const remaining = changelog.slice(contentStart);
            const nextHeading = remaining.search(/\n##\s+/);
            releaseBody = remaining
              .slice(0, nextHeading === -1 ? undefined : nextHeading)
              .trim();
            break;
          }

          fs.writeFileSync(
            'release-notes.md',
            releaseBody
              ? `# ${version}\n\n${releaseBody}\n`
              : `# ${version}\n\nNo matching CHANGELOG.md section was found for this package version.\n`,
          );
          NODE

          if grep -q "No matching CHANGELOG.md section" release-notes.md; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        uses: actions/github-script@v7
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          PACKAGE_PRERELEASE: ${{ steps.package.outputs.prerelease }}
          CHANGELOG_FOUND: ${{ steps.release-notes.outputs.found }}
        with:
          script: |
            const fs = require('node:fs');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const version = process.env.PACKAGE_VERSION;
            const tag = `v${version}`;
            const prerelease = process.env.PACKAGE_PRERELEASE === 'true';
            const body = fs.readFileSync('release-notes.md', 'utf8');
            const releasePayload = {
              owner,
              repo,
              tag_name: tag,
              name: tag,
              body,
              prerelease,
              draft: false,
              target_commitish: context.sha,
            };

            if (process.env.CHANGELOG_FOUND !== 'true') {
              core.warning(`No matching CHANGELOG.md section was found for ${version}. The GitHub Release will include a placeholder note.`);
            }

            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              });

              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: existing.data.id,
                tag_name: tag,
                name: tag,
                body,
                prerelease,
                draft: false,
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              await github.rest.repos.createRelease(releasePayload);
            }
